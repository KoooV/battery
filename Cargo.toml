[package]
name = "battery-tray"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
hidapi = "2.6.7"
ksni = { version = "0.3.7", features = ["blocking"] }
notify-rust = "4.19.0"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "6.3.0"

[lints.cargo]
# The stack crates from PLAN.md are declared together in the skeleton, but zbus,
# ksni, tiny-skia, notify-rust and hidapi get their first users only in stages
# 2, 3, 5 and 6. Until then cargo would flag each of them as unused.
unused_dependencies = "allow"
